[workspace]
resolver = "2"
members = ["crates/app", "crates/contracts"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }

# Shared platform crates. Path deps for local dev; switch to pinned git tags
# (or a private registry) once each service lives in its own repository.
hrms-kernel = { path = "../hrms-shared/crates/hrms-kernel" }
hrms-platform = { path = "../hrms-shared/crates/hrms-platform" }
hrms-auth = { path = "../hrms-shared/crates/hrms-auth" }
hrms-persistence = { path = "../hrms-shared/crates/hrms-persistence" }
hrms-messaging = { path = "../hrms-shared/crates/hrms-messaging" }
hrms-api-kit = { path = "../hrms-shared/crates/hrms-api-kit" }
